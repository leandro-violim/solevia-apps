<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    Original artwork: a spent / deflated bubble-wrap dome viewed top-down — a
    flattened, crumpled sheet of translucent plastic with soft creases and a few
    glints. Sits under the inflated bubble PNG and fades in when a bubble pops.
  -->
  <defs>
    <radialGradient id="film" cx="46%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#dbe4ec" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#aebccb" stop-opacity="0.10" />
    </radialGradient>
  </defs>

  <!-- crumpled outer blob (a slightly irregular, collapsed circle) -->
  <path
    d="M50 9 C67 8 82 19 88 37 C93 54 86 74 68 85 C52 95 30 92 17 78 C6 66 6 42 20 26 C28 16 39 10 50 9 Z"
    fill="url(#film)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.3" />

  <!-- major folds -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.2" stroke-linecap="round">
    <path d="M30 28 C42 42 47 54 41 72" />
    <path d="M58 20 C53 41 61 55 74 61" />
    <path d="M20 55 C39 52 55 57 79 45" />
    <path d="M43 18 C50 40 45 62 55 83" />
  </g>

  <!-- fine creases (a touch darker, for depth) -->
  <g fill="none" stroke="#748291" stroke-opacity="0.26" stroke-width="0.9" stroke-linecap="round">
    <path d="M35 38 C45 48 47 58 43 67" />
    <path d="M61 34 C59 46 65 54 71 58" />
    <path d="M33 62 C45 60 55 62 66 56" />
  </g>

  <!-- glints where light catches the folds -->
  <circle cx="37" cy="33" r="2.6" fill="#ffffff" fill-opacity="0.55" />
  <circle cx="64" cy="50" r="1.7" fill="#ffffff" fill-opacity="0.45" />
  <circle cx="46" cy="70" r="1.3" fill="#ffffff" fill-opacity="0.4" />
</svg>
