# Cap Kickers — Android app version (single source of truth for the Play build).
#
# For EVERY Play upload:
#   • VERSION_CODE — bump by 1 (integer). Google Play rejects a reused code.
#   • VERSION_NAME — the user-visible version (e.g. 1.0.1). Bump on a real change.
#
# iOS versions live in the Xcode project (MARKETING_VERSION / CURRENT_PROJECT_VERSION);
# keep them in step with these for a coordinated cross-platform release.
VERSION_NAME=1.1.1
VERSION_CODE=3
